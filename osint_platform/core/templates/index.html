<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSINT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4 text-center">🕵️‍♂️ OSINT Platform</h1>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">🔍 Проверка Email</h5>
                    <form method="get" action="/scan/email/">
                        <div class="mb-3">
                            <input type="email" class="form-control" name="email" placeholder="example@mail.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Проверить Email</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">🌐 Проверка Доменов (WHOIS)</h5>
                    <form method="get" action="/scan/domain/">
                        <div class="mb-3">
                            <input type="text" class="form-control" name="domain" placeholder="example.com" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Проверить Домен</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mt-5">📜 История запросов</h4>
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Тип</th>
                    <th>Запрос</th>
                    <th>Дата</th>
                    <th>Результат</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in history %}
                <tr>
                    <td>{{ entry.query_type }}</td>
                    <td>{{ entry.input_data }}</td>
                    <td>{{ entry.created_at|date:"Y-m-d H:i" }}</td>
                    <td><pre class="m-0">{{ entry.result|safe }}</pre></td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">Нет данных</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
